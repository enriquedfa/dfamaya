<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72">
  <!-- Kakera's launcher icon, redrawn from the app's vector layers
       (ic_launcher_background, light and night, + ic_launcher_foreground). The viewBox is
       the adaptive icon's visible 72 of its 108 units. Like the launcher, the background
       follows the system's dark mode. -->
  <style>
    .night { display: none; }
    @media (prefers-color-scheme: dark) { .day { display: none; } .night { display: inline; } }
  </style>
  <defs>
    <clipPath id="shape"><rect x="18" y="18" width="72" height="72" rx="16.3"/></clipPath>
    <linearGradient id="bg-day" gradientUnits="userSpaceOnUse" x1="54" y1="0" x2="54" y2="108">
      <stop offset="0" stop-color="#FFEBF5"/><stop offset="1" stop-color="#FAD6E9"/>
    </linearGradient>
    <linearGradient id="bg-night" gradientUnits="userSpaceOnUse" x1="54" y1="0" x2="54" y2="108">
      <stop offset="0" stop-color="#2C2126"/><stop offset="1" stop-color="#1B1317"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="54" cy="87" r="26">
      <stop offset="0" stop-color="#8E3A66" stop-opacity="0.32"/><stop offset="1" stop-color="#8E3A66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frill" gradientUnits="userSpaceOnUse" x1="35" y1="32.5" x2="45.841" y2="59.078">
      <stop offset="0" stop-color="#BC5C8E"/><stop offset="1" stop-color="#AE3D77"/>
    </linearGradient>
    <linearGradient id="inside" gradientUnits="userSpaceOnUse" x1="36" y1="36" x2="43.2" y2="57.6">
      <stop offset="0" stop-color="#702E50"/><stop offset="1" stop-color="#531D39"/>
    </linearGradient>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="32" y1="47" x2="71.819" y2="90.801">
      <stop offset="0" stop-color="#9C406F"/><stop offset="1" stop-color="#802D58"/>
    </linearGradient>
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="32" y1="47" x2="71.819" y2="90.801">
      <stop offset="0" stop-color="#702E50"/><stop offset="1" stop-color="#531D39"/>
    </linearGradient>
    <linearGradient id="light" gradientUnits="userSpaceOnUse" x1="32" y1="47" x2="71.819" y2="90.801">
      <stop offset="0" stop-color="#BC5C8E"/><stop offset="1" stop-color="#AE3D77"/>
    </linearGradient>
    <linearGradient id="cord" gradientUnits="userSpaceOnUse" x1="41" y1="47" x2="41.683" y2="52.921">
      <stop offset="0" stop-color="#451C31"/><stop offset="1" stop-color="#260D1A"/>
    </linearGradient>
    <linearGradient id="cord-l" gradientUnits="userSpaceOnUse" x1="43" y1="49" x2="57.969" y2="55.736">
      <stop offset="0" stop-color="#451C31"/><stop offset="1" stop-color="#260D1A"/>
    </linearGradient>
    <linearGradient id="cord-r" gradientUnits="userSpaceOnUse" x1="56" y1="49" x2="71.61" y2="55.108">
      <stop offset="0" stop-color="#451C31"/><stop offset="1" stop-color="#260D1A"/>
    </linearGradient>
    <linearGradient id="tassel-l" gradientUnits="userSpaceOnUse" x1="40.2" y1="67.2" x2="45.8" y2="72.8">
      <stop offset="0" stop-color="#451C31"/><stop offset="1" stop-color="#260D1A"/>
    </linearGradient>
    <linearGradient id="tassel-r" gradientUnits="userSpaceOnUse" x1="62.2" y1="70.2" x2="67.8" y2="75.8">
      <stop offset="0" stop-color="#451C31"/><stop offset="1" stop-color="#260D1A"/>
    </linearGradient>
    <linearGradient id="knot" gradientUnits="userSpaceOnUse" x1="50.8" y1="45.3" x2="57.2" y2="51.7">
      <stop offset="0" stop-color="#451C31"/><stop offset="1" stop-color="#260D1A"/>
    </linearGradient>
    <clipPath id="right-side"><path d="M54,20 C66,44 64,68 50,92 L96,92 L96,20 Z"/></clipPath>
    <clipPath id="left-side"><path d="M20,20 L42,20 C34,44 36,68 46,92 L20,92 Z"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <g class="day">
      <rect width="108" height="108" fill="url(#bg-day)"/>
      <path fill="#FBD0E6" d="M108,0 L108,108 L0,108 Z"/>
      <path fill="#F6C1DC" fill-opacity="0.6" d="M108,0 L108,108 L30,108 Z"/>
    </g>
    <g class="night">
      <rect width="108" height="108" fill="url(#bg-night)"/>
      <path fill="#4A2136" d="M108,0 L108,108 L0,108 Z"/>
      <path fill="#56253E" fill-opacity="0.6" d="M108,0 L108,108 L30,108 Z"/>
    </g>
    <!-- The pouch: scaled 0.88 about (54, 58.5), lifted 4.5 -->
    <g transform="translate(54 54) scale(0.88) translate(-54 -58.5)">
      <g transform="translate(0 87) scale(1 0.23077) translate(0 -87)">
        <path fill="url(#glow)" d="M80,87 C80,101.359 68.359,113 54,113 C39.641,113 28,101.359 28,87 C28,72.641 39.641,61 54,61 C68.359,61 80,72.641 80,87 Z"/>
      </g>
      <path fill="url(#frill)" d="M44,48 C39,46 35,41 35,35 Q38,31 41,35 Q44,30 48,35 Q51,30 54,35 Q57,30 60,35 Q64,30 67,35 Q70,31 73,35 C73,41 69,46 64,48 Z"/>
      <path fill="url(#inside)" d="M44,48 C40,46 36,42 36,36 C42,42 66,42 72,36 C72,42 68,46 64,48 Z"/>
      <path fill="url(#body)" d="M45,47 C37,52 32,63 32,74 C32,83 39,87 47,87 L61,87 C69,87 76,83 76,74 C76,63 71,52 63,47 Z"/>
      <path clip-path="url(#right-side)" fill="url(#shade)" d="M45,47 C37,52 32,63 32,74 C32,83 39,87 47,87 L61,87 C69,87 76,83 76,74 C76,63 71,52 63,47 Z"/>
      <path clip-path="url(#left-side)" fill="url(#light)" fill-opacity="0.55" d="M45,47 C37,52 32,63 32,74 C32,83 39,87 47,87 L61,87 C69,87 76,83 76,74 C76,63 71,52 63,47 Z"/>
      <g fill="none" stroke-linecap="round">
        <path stroke="url(#cord)" stroke-width="4.2" d="M41,47 C46,51 62,51 67,47"/>
        <path stroke="url(#cord-l)" stroke-width="2.6" d="M52,49 C48,56 44,62 43,69"/>
        <path stroke="url(#cord-r)" stroke-width="2.6" d="M56,49 C60,56 64,62 65,72"/>
      </g>
      <circle cx="43" cy="70" r="2.8" fill="url(#tassel-l)"/>
      <circle cx="65" cy="73" r="2.8" fill="url(#tassel-r)"/>
      <circle cx="54" cy="48.5" r="3.2" fill="url(#knot)"/>
    </g>
  </g>
</svg>
